<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoVault | CP Memoir</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }
        header {
            text-align: center;
            margin-bottom: 3rem;
        }
        h1 { margin: 0; font-size: 2.5rem; color: var(--accent); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 1.5rem;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); }
        .card.uncategorized {
            border: 1px solid var(--danger);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
        }
        .card h2 { margin: 0 0 10px 0; font-size: 1.2rem; }
        .card a { color: var(--accent); text-decoration: none; }
        .card a:hover { text-decoration: underline; }
        .tag {
            display: inline-block;
            background: #334155;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin: 4px 4px 0 0;
            color: var(--text-muted);
        }
        .date { font-size: 0.8rem; color: var(--text-muted); margin-top: 15px; display: block; }
    </style>
</head>
<body>

    <header>
        <h1>AlgoVault Memoir</h1>
        <p>A dynamic archive of Competitive Programming solutions.</p>
    </header>

    <div class="grid" id="problem-grid">
        </div>

    <script>
        fetch('database.json')
            .then(response => response.json())
            .then(data => {
                const grid = document.getElementById('problem-grid');
                
                // Reverse the array so the newest problems show up first
                data.reverse().forEach(problem => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    // If Gemini failed to categorize, apply the red danger class!
                    if (problem.category === "Uncategorized") {
                        card.classList.add('uncategorized');
                    }

                    // Map arrays to HTML span tags
                    const techTags = problem.techniques.map(t => `<span class="tag">${t}</span>`).join('');
                    const dsTags = problem.data_structures.map(d => `<span class="tag">${d}</span>`).join('');

                    card.innerHTML = `
                        <h2><a href="${problem.url}" target="_blank">${problem.name}</a></h2>
                        <p style="color: var(--accent); font-weight: bold; margin: 5px 0;">${problem.category}</p>
                        
                        <div style="margin-top: 10px;">
                            ${techTags}
                            ${dsTags}
                        </div>
                        
                        <a href="${problem.local_link}" target="_blank" style="display: block; margin-top: 15px; font-size: 0.9rem;">View Local Code ➔</a>
                        <span class="date">Solved: ${problem.date}</span>
                    `;
                    grid.appendChild(card);
                });
            })
            .catch(error => console.error('Error loading database:', error));
    </script>
</body>
</html>
